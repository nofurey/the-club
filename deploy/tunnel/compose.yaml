services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: the_club
      POSTGRES_USER: the_club
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in ~/.config/the-club/refresh.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - the-club-postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: the-club-api:local
    build:
      context: ../..
      dockerfile: deploy/tunnel/Dockerfile.api
    network_mode: host
    restart: unless-stopped
    env_file:
      - ${HOME}/.config/the-club/api.env
      - ${HOME}/.config/the-club/refresh.env
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  refresh-worker:
    image: the-club-api:local
    network_mode: host
    restart: unless-stopped
    init: true
    env_file:
      - ${HOME}/.config/the-club/refresh.env
    environment:
      NODE_ENV: production
    command:
      - ./node_modules/.bin/tsx
      - src/jobs/official-data-refresh.ts
    depends_on:
      api:
        condition: service_healthy

  club-web:
    image: the-club-web:local
    build:
      context: ../..
      dockerfile: deploy/tunnel/Dockerfile.web
    network_mode: host
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in the private tunnel env file}

volumes:
  the-club-postgres-data-v18:
